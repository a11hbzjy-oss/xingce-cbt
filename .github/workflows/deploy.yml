name: Build & Deploy Xingce CBT to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shallow clone ERRRC/xingcezhenti past-paper repo
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ERRRC/xingcezhenti.git /tmp/xingcezhenti
          cd /tmp/xingcezhenti
          git sparse-checkout set 01-政治理论 02-常识判断 03-言语理解与表达 04-数量关系 05-判断推理 06-资料分析

      - name: Parse, deduplicate & shard real questions into static JSON
        run: |
          python3 scripts/sync_bank.py --repo-dir /tmp/xingcezhenti --out-dir dist --min-year 2020 --max-per-module 1200

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
